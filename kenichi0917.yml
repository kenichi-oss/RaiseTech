AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EC2にはJava 17とsystemdサービスの雛形を用意しますが、Spring Bootのjar本体は別途手動配置が必要です。

Parameters:
  ProjectName:
    Type: String
    Default: kenichi-app
    Description: リソース名に付与するプレフィックス

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16

  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.0.0/24
  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.10.0/24
  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.11.0/24

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium] #選択できるインスタンスタイプを制限できる→AllowedValues

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: kenkey0915
    Description: EC2にSSH接続する際のキーペア名

  LatestAmiId:     #AMIDは、OSのアップデートのたびに変わるから⬇︎を設定して直接 AMID を入力しない。
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id> #SSMパラメータストアから直接 AMID をとってくる。
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64  #SSMパラメータストアの住所パス
    
  DBEngine:
    Type: String
    Default: mysql
    AllowedValues: [mysql]

  DBInstanceClass:
    Type: String
    Default: db.t3.micro

  DBName:
    Type: String
    Default: kenichidb

  DBUsername:
    Type: String
    Default: admin #何も指定しなければadmin を入力
    NoEcho: true  #NoEcho が　true とは、上記の Default 値をマスクしますという意味。

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDSマスターパスワード(8文字以上)

  DBAllocatedStorage:
    Type: Number
    Default: 20

Resources:

  ##########################
  # VPC
  ##########################
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  ##########################
  # Subnets
  # パブリック: EC2 / ALB用(2AZ, ALBの要件で2つ以上必要)
  # プライベート: RDS用(2AZ, DBサブネットグループの要件で2つ以上必要。RDS自体はシングルAZで起動)
  ##########################
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs ''] #!GetAZs ''は、AWSから現在のリージョンで使えるAZの一覧を取得。!Select[0,a] aのうちの0番目を選択するという意味。
      MapPublicIpOnLaunch: true   #このサブネットに配置されたEC2 に自動でパブリックIP アドレスを付与するかどうかの true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-2

  ##########################
  # Route Tables
  # NATゲートウェイは作成しない(コスト削減)。
  # プライベートサブネットは外向き経路を持たない = インターネットから直接到達不可、かつ自身からも出て行けない。
  # RDSはEC2(パブリックサブネット)からのみVPC内部通信でアクセスする構成。
  ##########################
  PublicRouteTable:         #案内表
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment  #DependsOn で、このPublicRoute を作成する前に、IGWAttachmet を実行してね。という意味。
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-rt

  PrivateSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  ##########################
  # Security Groups
  ##########################
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB   #ALB用 - インターネットから80/443を許可
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-alb-sg

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2  #EC2用 - ALBからの8080のみ許可
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-ec2-sg

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS #RDS用 - EC2からの3306のみ許可　GroupDescription は日本語はだめ。
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref EC2SecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-db-sg

  ##########################
  # ALB
  ##########################
  ApplicationLoadBalancer:  #建物
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-alb
      Type: application   #ALBタイプを選択
      Scheme: internet-facing   #インターネットから直接アクセスできるALBにする。
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-tg
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:   #建物の受付カウンター(80番ポートのカウンター)
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward  #受け取った通信を転送する。
          TargetGroupArn: !Ref ALBTargetGroup  #どこに？ TargetGroupArn で記載のグループに転送する。

  ##########################
  # EC2 (Launch Template + Auto Scaling Group)
  # コスト重視のためパブリックサブネットに配置(NATゲートウェイ不要)
  ##########################
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyPairName
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        SubnetId: !Ref PublicSubnet1
        Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-ec2
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Java 17 (Amazon Corretto) をインストール
            dnf install -y java-17-amazon-corretto-headless

            # アプリ配置用ディレクトリとユーザーを作成
            mkdir -p /opt/app
            useradd -r -s /sbin/nologin springboot || true
            chown -R springboot:springboot /opt/app

            # jarファイルは後で /opt/app/app.jar に手動配置してください
            # (scp や S3, CodeDeploy などでアップロード後、systemctl start springboot)

            # systemdサービスを定義(jar配置後、自動起動できるように雛形として用意)
            cat <<'EOF' > /etc/systemd/system/springboot.service
            [Unit]
            Description=Spring Boot Application
            After=network.target

            [Service]
            User=springboot
            WorkingDirectory=/opt/app
            ExecStart=/usr/bin/java -jar /opt/app/app.jar
            SuccessExitStatus=143
            Restart=on-failure

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable springboot
            # jar配置後、下記コマンドで起動します:
            #   systemctl start springboot

  ##########################
  # RDS(シングルAZ・単一インスタンス)
  ##########################
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RDS #RDS用サブネットグループ(プライベートサブネット、AZ要件のため2つ指定)
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-db
      Engine: !Ref DBEngine
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      MultiAZ: false
      PubliclyAccessible: false
      StorageType: gp3
      BackupRetentionPeriod: 1

Outputs:
  VPCId:
    Value: !Ref VPC
  ALBDNSName:
    Description: アプリケーションへのアクセスURL
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  RDSEndpoint:
    Description: RDSエンドポイント
    Value: !GetAtt RDSInstance.Endpoint.Address