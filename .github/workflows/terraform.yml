name: Terraform CI/CD

on:
  push:
    branches: ["**"]
    paths:
      - "terraform-aws-study/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_VERSION: "1.16.4"
  TF_ROOT: terraform-aws-study
  TF_WORKING_DIR: terraform-aws-study/envs/development

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_ROOT }}

      - name: Configure AWS credentials (read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform plan
        run: terraform plan -input=false -lock=false
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_notification_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

  cd:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (apply)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_APPLY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_APPLY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_notification_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}