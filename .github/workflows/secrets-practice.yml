
on:
  pull_request:
    paths:
      - ".github/workflows/secrets-practice.yml"

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    env:
      TF_VAR_demo_password: ${{ secrets.DEMO_SECRET }}
      DEMO_VAR: ${{ vars.DEMO_VAR }}
    steps:
      - name: Variables は、そのまま表示される
        run: echo "DEMO_VAR = $DEMO_VAR"

      - name: Secrets は、*** に置き換わる
        run: echo "TF_VAR_demo_password = $TF_VAR_demo_password"

      - name: 値が入っているかだけ確認する
        run: |
          if [ -n "$TF_VAR_demo_password" ]; then
            echo "シークレットは設定されています"
          else
            echo "シークレットが空です"
          fi
