name: practice

on:
  workflow_dispatch:          # 手動で実行するボタンを出す
  pull_request:               # PR を作った・更新したときに動く
    paths:
      - "terraform-aws-study/**"   # このフォルダを変更したときだけ

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # ①コードを取得する(これが無いとファイルが見えない)

      - name: 実行のきっかけを表示
        run: echo "きっかけ: ${{ github.event_name }}"

      - name: フォルダの中身を表示
        working-directory: terraform-aws-study/envs/development
        run: ls -la
