name: Terraform CI

on:
    pull_request:
        paths:
            - 'terraform/**'
            - ".github/workflows/terraform-ci.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
 check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-aws-study/envs/development
    steps:
        - uses: actions/checkout@v4

        - uses: hashicorp/setup-terraform@v3
          with:
           terraform_version: "~> 1.10"

        - name: Terraform fmt
          working-directory: terraform-aws-study
          run: terraform fmt -check -recursive

        - name: Terraform init
          run: terraform init -backend=false

        - name: Terraform validate
          run: terraform validate

        - name: Terraform test
          run: terraform test